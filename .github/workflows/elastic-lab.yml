name: Elastic Stack lab

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/elastic-lab.yml"
      - "projects/elastic-stack-lab/**"
      - "tests/test_elastic_lab.py"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Check generated EVE records
        run: python -m pytest -q tests/test_elastic_lab.py
      - name: Prepare Elasticsearch host setting
        run: sudo sysctl -w vm.max_map_count=1048576
      - name: Generate synthetic traffic and validate Compose
        working-directory: projects/elastic-stack-lab
        run: |
          python scripts/generate_eve.py
          docker compose config --quiet
      - name: Start Elastic Stack
        working-directory: projects/elastic-stack-lab
        run: docker compose up -d
      - name: Confirm alerts were indexed
        working-directory: projects/elastic-stack-lab
        run: python scripts/check_alerts.py --timeout 300
      - name: Show container logs on failure
        if: failure()
        working-directory: projects/elastic-stack-lab
        run: docker compose logs --no-color --tail=100
      - name: Stop Elastic Stack
        if: always()
        working-directory: projects/elastic-stack-lab
        run: docker compose down
